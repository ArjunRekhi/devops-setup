{{- if not .Values.secrets.existingSecret }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "podinfo-app.secretName" . }}
  labels:
    {{- include "podinfo-app.labels" . | nindent 4 }}
type: Opaque
stringData:
  # stringData so typos are visible rather than hidden behind base64.
  API_KEY: {{ required "secrets.apiKey must be set" .Values.secrets.apiKey | quote }}
{{- end }}
