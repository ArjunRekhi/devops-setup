apiVersion: v1
kind: ServiceAccount
metadata:
  name: podinfo
  namespace: podinfo
  labels:
    app.kubernetes.io/name: podinfo
    app.kubernetes.io/version: "6.14.1"
    app.kubernetes.io/managed-by: kubectl
# Dedicated SA so an IAM role can attach on EKS without granting it to `default`.
automountServiceAccountToken: false
